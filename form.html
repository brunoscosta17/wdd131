<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description"
        content="Product Review Form for WDD 131 - Dynamic Web Fundamentals assignment by Bruno Costa. Submit and track product reviews dynamically.">
    <meta name="author" content="Bruno Costa">

    <title>Product Review</title>

    <link rel="stylesheet" href="styles/base.css" />
    <link rel="stylesheet" href="styles/form.css" />
</head>

<body>
    <header class="site-header">
        <h1>Product Review</h1>
    </header>

    <main>
        <form class="review-form" method="get" action="review.html">
            <div class="form-group">
                <label for="productName" class="required">Product Name</label>
                <select id="productName" name="productName" required>
                    <option value="" disabled selected>Select a Product ...</option>
                </select>
            </div>

            <fieldset class="form-group">
                <legend class="required">Overall Rating</legend>
                <div class="rating-group">
                    <div class="rating-option">
                        <input type="radio" id="rating1" name="rating" value="1" required />
                        <label for="rating1" aria-label="1 star">★☆☆☆☆</label>
                    </div>
                    <div class="rating-option">
                        <input type="radio" id="rating2" name="rating" value="2" required />
                        <label for="rating2" aria-label="2 stars">★★☆☆☆</label>
                    </div>
                    <div class="rating-option">
                        <input type="radio" id="rating3" name="rating" value="3" required />
                        <label for="rating3" aria-label="3 stars">★★★☆☆</label>
                    </div>
                    <div class="rating-option">
                        <input type="radio" id="rating4" name="rating" value="4" required />
                        <label for="rating4" aria-label="4 stars">★★★★☆</label>
                    </div>
                    <div class="rating-option">
                        <input type="radio" id="rating5" name="rating" value="5" required />
                        <label for="rating5" aria-label="5 stars">★★★★★</label>
                    </div>
                </div>
            </fieldset>

            <div class="form-group">
                <label for="installationDate" class="required">Date of Installation</label>
                <input type="date" id="installationDate" name="installationDate" required />
            </div>

            <fieldset class="form-group">
                <legend>Which features did you find useful in the product?<br>
                    <span class="hint">(Check all that apply)</span>
                </legend>

                <div class="checkbox-group">
                    <div class="checkbox-item">
                        <input type="checkbox" id="feature-durability" name="features" value="durability" />
                        <label for="feature-durability">Durability</label>
                    </div>

                    <div class="checkbox-item">
                        <input type="checkbox" id="feature-ease" name="features" value="ease-of-use" />
                        <label for="feature-ease">Ease of Use</label>
                    </div>

                    <div class="checkbox-item">
                        <input type="checkbox" id="feature-performance" name="features" value="performance" />
                        <label for="feature-performance">Performance</label>
                    </div>

                    <div class="checkbox-item">
                        <input type="checkbox" id="feature-design" name="features" value="design" />
                        <label for="feature-design">Design</label>
                    </div>
                </div>
            </fieldset>

            <div class="form-group">
                <label for="reviewText">
                    Written Review <span class="hint">(Optional)</span>
                </label>
                <textarea id="reviewText" name="reviewText" rows="6"
                    placeholder="Share your experience with this product..."></textarea>
            </div>

            <div class="form-group">
                <label for="userName">
                    Your Name <span class="hint">(Optional)</span>
                </label>
                <input type="text" id="userName" name="userName" placeholder="Your name" />
            </div>

            <div class="form-group submit-group">
                <input type="submit" value="Post Review" />
            </div>
        </form>
    </main>

    <footer class="site-footer">
        <p>&copy; <span id="currentyear"></span> Bruno Costa – Brazil</p>
        <p>Last Modification: <span id="lastModified"></span></p>
    </footer>

    <script src="scripts/getdates.js" defer></script>
    <script src="scripts/form.js" defer></script>
</body>

</html>
