<!doctype html>
<html lang="en">

<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="description" content="Temple Album project showcasing temples with filters by year and size." />
    <meta name="author" content="Bruno da Silva Costa" />
    <title>Filtered Temple Album</title>

    <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;700&family=Merriweather:wght@700&display=swap"
        rel="stylesheet">

    <link rel="stylesheet" href="styles/filtered-temples.css">
    <link rel="stylesheet" href="styles/temples-large.css" media="(min-width: 760px)">

    <script src="scripts/filtered-temples.js" defer></script>
</head>

<body>
    <header class="site-header">
        <div class="brand-row">
            <h1 class="brand">Temple Album</h1>

            <button class="hamburger" id="hamburger" aria-label="Menu" aria-controls="primary-nav"
                aria-expanded="false">
                <span class="hamburger-lines" aria-hidden="true"></span>
                <span class="visually-hidden">Menu</span>
            </button>
        </div>

        <nav id="primary-nav" class="site-nav" aria-label="Primary">
            <ul>
                <li><a href="#" class="active" data-filter="home">Home</a></li>
                <li><a href="#" data-filter="old">Old</a></li>
                <li><a href="#" data-filter="new">New</a></li>
                <li><a href="#" data-filter="large">Large</a></li>
                <li><a href="#" data-filter="small">Small</a></li>
            </ul>
        </nav>
    </header>

    <main class="container">
        <h2 class="page-title" id="page-title">Home</h2>

        <section class="album" id="temple-cards" aria-label="Temple cards"></section>
    </main>

    <footer class="site-footer">
        <p>&copy; <span id="currentyear"></span> • Bruno da Silva Costa • Brazil</p>
        <p id="lastModified" aria-live="polite"></p>
    </footer>

    <span class="visually-hidden" id="sr-status" aria-live="polite"></span>
</body>

</html>
